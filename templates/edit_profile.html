{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<h1>Edit Profile</h1>

<form action="/user/profile" method="POST">

    <label>Name</label>

    <input type="text"
           name="name"
           value="{{ user['name'] }}"
           required>

    <br><br>

    <label>Email</label>

    <input type="email"
           name="email"
           value="{{ user['email'] }}"
           required>

    <br><br>




    <button type="submit">
        Update Profile
    </button>

</form>

{% endblock %}
