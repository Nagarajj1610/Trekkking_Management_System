{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<h1>Edit Trek</h1>

<form action="/trek/{{ trek['trek_id'] }}/update" method="POST">

    <label>Trek Name</label>
    <input type="text"
           name="trek_name"
           value="{{ trek['trek_name'] }}"
           required>

    <br><br>

    <label>Location</label>
    <input type="text"
           name="location"
           value="{{ trek['location'] }}"
           required>

    <br><br>

    <label>Difficulty</label>

    <select name="difficulty">

        <option value="Easy"
            {% if trek['difficulty'] == 'Easy' %}selected{% endif %}>
            Easy
        </option>

        <option value="Moderate"
            {% if trek['difficulty'] == 'Moderate' %}selected{% endif %}>
            Moderate
        </option>

        <option value="Hard"
            {% if trek['difficulty'] == 'Hard' %}selected{% endif %}>
            Hard
        </option>

    </select>

    <br><br>

    <label>Duration</label>
    <input type="number"
           name="duration"
           value="{{ trek['duration'] }}">

    <br><br>

    <label>Available Slots</label>
    <input type="number"
           name="available_slots"
           value="{{ trek['available_slots'] }}"
           min="0">

    <br><br>

    <label>Status</label>

    <select name="status">

        <option value="Open"
            {% if trek['status'] == 'Open' %}selected{% endif %}>
            Open
        </option>

        <option value="Started"
            {% if trek['status'] == 'Started' %}selected{% endif %}>
            Started
        </option>

        <option value="Completed"
            {% if trek['status'] == 'Completed' %}selected{% endif %}>
            Completed
        </option>

    </select>

    <br><br>

    <label>Start Date</label>
    <input type="date"
           name="start_date"
           value="{{ trek['start_date'] }}">

    <br><br>

    <label>End Date</label>
    <input type="date"
           name="end_date"
           value="{{ trek['end_date'] }}">

    <br><br>

    <label>Description</label>

    <textarea name="description">{{ trek['description'] }}</textarea>

    <br><br>

    <button type="submit">
        Update Trek
    </button>

</form>

{% endblock %}
